name: 'CI'
on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - edited
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: 'Install Go'
        if: success()
        uses: actions/setup-go@v2
        with:
          go-version: 1.18.x
      - name: 'Checkout code'
        uses: actions/checkout@v4
      - name: 'Cache go modules'
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      #Core module
      - name: 'Run linters core module'
        uses: golangci/golangci-lint-action@v3
        with:
          working-directory: 'core'
          version: v1.50
          args: --timeout 5m
      - name: 'Run unit tests core module'
        run: go test -v ./core/...
      #Blockchain module
      - name: 'Build and vet blockchain module'
        run: |
          go build ./blockchain/...
          go vet ./blockchain/...
      - name: 'Run unit tests blockchain module'
        run: go test -v ./blockchain/...

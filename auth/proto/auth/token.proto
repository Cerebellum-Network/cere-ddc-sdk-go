syntax = "proto3";

package auth;

option go_package = "github.com/Cerebellum-Network/ddc-proto/auth";

import "signature/signature.proto";

// Token represents trust chain of tokens where first token is verifiable by bucket access on chain
// and last token is generated by the client that sends a request.
message AuthToken {
  signature.Signature signature = 1; // signature signer is an issuer
  Payload payload = 2;
}

message Payload {
  optional AuthToken prev = 1;
  optional bytes subject = 2;
  optional bool canDelegate = 3;
  optional uint64 bucketId = 4;
  repeated Operation operations = 5;
  optional int64 expiresAt = 6;
  optional bytes pieceCid = 7;
}

enum Operation {
  UNKNOWN = 0;
  PUT = 1;
  GET = 2;
  DELETE = 3;
  COMPUTE = 4;
}

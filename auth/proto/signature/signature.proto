syntax = "proto3";

package signature;

option go_package = "github.com/Cerebellum-Network/ddc-proto/signature";

message Signature {
  Algorithm algorithm = 1;
  bytes signer = 2;
  bytes value = 3;

  enum Algorithm {
    ED_25519 = 0;
    SR_25519 = 1;
  }
}

message SignedResponse {
  Signature signature = 1;
  bytes payload = 2;
}

syntax = "proto3";

package activity;

option go_package = "github.com/Cerebellum-Network/ddc-proto/activity";

import "signature/signature.proto";
import "auth/token.proto";

message ActivityRecord {
	bytes id = 1;
	ActivityFulfillment upstream = 2;
	repeated ActivityFulfillment downstream = 3;
	uint64 timestamp = 4;
	signature.Signature signature = 5;
	optional auth.AuthToken authToken = 6;
}

message ActivityRequest {
	optional ActivityRequest parentRequest = 1;
	string requestId = 2;

	enum RequestType {
		REQUEST_TYPE_PUT = 0;
		REQUEST_TYPE_GET = 1;
		REQUEST_TYPE_DELETE = 2;
		REQUEST_TYPE_COMPUTE = 3;
	}

	enum ContentType {
		CONTENT_TYPE_PIECE = 0;
		CONTENT_TYPE_SEGMENT = 1;
		CONTENT_TYPE_MERKLE_TREE = 2;
		CONTENT_TYPE_METADATA = 3;
		CONTENT_TYPE_NONE = 4;
	}

	RequestType requestType = 3;
	ContentType contentType = 4;
	uint64 bucketId = 5;
	bytes pieceCid = 6;

	uint64 offset = 7;
	uint64 size = 8;

	uint64 timestamp = 9;
	signature.Signature signature = 10;
}

message ActivityAcknowledgment {
	string requestId = 1;
	uint64 bytesStoredOrDelivered = 2;
	uint64 timestamp = 3;
	uint64 cpuUnits = 4;
	uint64 gpuUnits = 5;
	uint64 ramUnits = 6;
	signature.Signature signature = 7;
}

message ActivityResponse {
	Status status = 1;
	uint32 time = 2;
	bytes peerID = 3;

	enum Status {
		UNKNOWN = 0;
		OK = 1;
		NOT_FOUND = 2;
		INTERNAL = 3;
		UNAVAILABLE = 4;
		ABORTED = 5;
	}
}

message ActivityFulfillment {
	ActivityRequest request = 1;
	optional ActivityAcknowledgment ack = 2;
	optional ActivityResponse response = 3;
}

message Aggregate {
  int64 stored = 1;
  uint64 delivered = 2;
  uint64 puts = 3;
  uint64 gets = 4;
  uint64 cpu_units = 5;
  uint64 gpu_units = 6;
  uint64 ram_units = 7;
  uint64 computes = 8;
}
